<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Домашні завдання</title>
</head>
<body>
    <h1>Домашні завдання</h1>

    <!-- Завдання 1: FizzBuzz -->
    <h2>Завдання 1: FizzBuzz</h2>
    <button onclick="fizzBuzz()">Запустити FizzBuzz</button>
    <p id="fizzBuzzResult"></p>

    <!-- Завдання 2: Перевірка числа на простоту -->
    <h2>Завдання 2: Перевірка числа на простоту</h2>
    <input type="number" id="primeInput" placeholder="Введіть число">
    <button onclick="checkPrime()">Перевірити</button>
    <p id="primeResult"></p>

    <!-- Завдання 3: Таблиця множення -->
    <h2>Завдання 3: Таблиця множення</h2>
    <input type="number" id="multiplicationInput" placeholder="Введіть число">
    <button onclick="generateMultiplicationTable()">Показати</button>
    <p id="multiplicationResult"></p>

    <!-- Завдання 4: Обчислення факторіалу -->
    <h2>Завдання 4: Обчислення факторіалу</h2>
    <input type="number" id="factorialInput" placeholder="Введіть число">
    <button onclick="calculateFactorial()">Обчислити</button>
    <p id="factorialResult"></p>

    <!-- Завдання 5: Пошук максимуму та мінімуму в масиві -->
    <h2>Завдання 5: Пошук максимуму та мінімуму в масиві</h2>
    <input type="text" id="arrayInput" placeholder="Введіть числа через кому">
    <button onclick="findMinMax()">Знайти</button>
    <p id="minMaxResult"></p>

    <script>
        // Завдання 1: FizzBuzz
        function fizzBuzz() {
            let result = "";
            for (let i = 1; i <= 100; i++) {
                if (i % 3 === 0 && i % 5 === 0) {
                    result += "FizzBuzz, ";
                } else if (i % 3 === 0) {
                    result += "Fizz, ";
                } else if (i % 5 === 0) {
                    result += "Buzz, ";
                } else {
                    result += i + ", ";
                }
            }
            document.getElementById("fizzBuzzResult").innerText = result.slice(0, -2);
        }

        // Завдання 2: Перевірка числа на простоту
        function isPrime(n) {
            if (n < 2) return false;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function checkPrime() {
            let num = document.getElementById("primeInput").value;
            let result = isPrime(Number(num)) ? "Число просте" : "Число не є простим";
            document.getElementById("primeResult").innerText = result;
        }

        // Завдання 3: Таблиця множення
        function generateMultiplicationTable() {
            let num = document.getElementById("multiplicationInput").value;
            let result = "";
            for (let i = 1; i <= 10; i++) {
                result += `${num} x ${i} = ${num * i}<br>`;
            }
            document.getElementById("multiplicationResult").innerHTML = result;
        }

        // Завдання 4: Обчислення факторіалу
        function factorial(n) {
            if (n === 0) return 1;
            let fact = 1;
            for (let i = 1; i <= n; i++) {
                fact *= i;
            }
            return fact;
        }

        function calculateFactorial() {
            let num = document.getElementById("factorialInput").value;
            let result = factorial(Number(num));
            document.getElementById("factorialResult").innerText = `Факторіал: ${result}`;
        }

        // Завдання 5: Пошук максимуму та мінімуму в масиві
        function findMinMax() {
            let input = document.getElementById("arrayInput").value;
            let numbers = input.split(",").map(Number);
            
            if (numbers.length === 0 || numbers.some(isNaN)) {
                document.getElementById("minMaxResult").innerText = "Помилка: введіть коректні числа!";
                return;
            }

            let max = Math.max(...numbers);
            let min = Math.min(...numbers);
            document.getElementById("minMaxResult").innerText = `Максимум: ${max}, Мінімум: ${min}`;
        }
    </script>
</body>
</html>
